<svg width="128" height="128" xmlns="http://www.w3.org/2000/svg">
  <!-- Farm icon: barn with sun -->
  <defs>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#87CEEB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#98D8E8;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Sky background -->
  <rect width="128" height="128" fill="url(#skyGradient)" rx="8"/>

  <!-- Sun -->
  <circle cx="96" cy="32" r="16" fill="#FFD700"/>

  <!-- Barn body -->
  <rect x="32" y="60" width="64" height="48" fill="#8B4513" rx="2"/>

  <!-- Barn roof -->
  <polygon points="64,40 24,60 104,60" fill="#CD5C5C"/>

  <!-- Barn door -->
  <rect x="52" y="76" width="24" height="32" fill="#654321" rx="2"/>

  <!-- Barn windows -->
  <rect x="38" y="68" width="10" height="10" fill="#FFE4B5" rx="1"/>
  <rect x="80" y="68" width="10" height="10" fill="#FFE4B5" rx="1"/>

  <!-- Grass -->
  <rect x="0" y="108" width="128" height="20" fill="#90EE90"/>

  <!-- Small plant -->
  <circle cx="20" cy="110" r="3" fill="#228B22"/>
  <line x1="20" y1="110" x2="20" y2="115" stroke="#228B22" stroke-width="2"/>
</svg>
